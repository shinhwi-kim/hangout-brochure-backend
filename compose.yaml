services:
  postgres:
    image: postgres:18-alpine
    container_name: hangout-brochure-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hangout_brochure}
      POSTGRES_USER: ${POSTGRES_USER:-hangout_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hangout_dev}
      # Opt in with LOAD_MOCK_DATA=true; see db-init/02-seed.sh.
      LOAD_MOCK_DATA: ${LOAD_MOCK_DATA:-false}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
      # Outside the init directory on purpose, so Postgres does not run it unconditionally.
      - ./db-seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
