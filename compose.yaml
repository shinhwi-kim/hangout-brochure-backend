services:
  postgres:
    image: postgres:18-alpine
    container_name: hangout-brochure-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hangout_brochure}
      POSTGRES_USER: ${POSTGRES_USER:-hangout_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hangout_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
